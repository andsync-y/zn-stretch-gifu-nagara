# Windsor REST APIで書き込みアクションを実行する汎用ワークフロー。
# MCPコネクタが不安定なときのバックアップ経路。
# dry_run=true ならアクション一覧の取得のみ（読み取り）。実行結果は windsor-data ブランチではなくログに出す。
name: windsor-action
on:
  workflow_dispatch:
    inputs:
      connector:
        description: 'コネクタ（例: google_my_business）'
        required: true
      action:
        description: 'アクションID（例: create_local_post）。dry_run時は不要'
        required: false
        default: ''
      params_json:
        description: 'アクションのパラメータ（JSON文字列）'
        required: false
        default: '{}'
      dry_run:
        description: 'true=アクション一覧の取得のみ / docs=実行エンドポイントのドキュメント調査'
        required: false
        default: 'true'
      max_len:
        description: '結果の切り詰め幅（既定8000。スキーマ調査時は大きくする）'
        required: false
        default: '8000'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 実行
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          CONNECTOR: ${{ github.event.inputs.connector }}
          ACTION: ${{ github.event.inputs.action }}
          PARAMS_JSON: ${{ github.event.inputs.params_json }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAXLEN: ${{ github.event.inputs.max_len }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$DRY_RUN" = "head" ]; then
            # リダイレクト調査用。ACTION=URL のレスポンスヘッダをチェーンごと出す（本文は捨てる）
            curl -sS -D - -o /dev/null -L --max-time 30 "$ACTION" > out/result.txt || echo "(head失敗)" > out/result.txt
          elif [ "$DRY_RUN" = "fetch" ]; then
            # 公開URLの取得ユーティリティ。サンドボックスの外向き通信が遮断されているとき、
            # 自サイトの公開HTML（ピクセルIDなど）をランナー経由で読むために使う。ACTION=URL
            curl -sSL --max-time 30 "$ACTION" | head -c 200000 > out/result.txt || echo "(fetch失敗)" > out/result.txt
          elif [ "$DRY_RUN" = "mcp" ]; then
            # ACTION=MCPツール名, PARAMS_JSON=そのtoolのarguments
            # 結果は windsor-log ブランチにも残す（Actionsのログを引くのは高コストなため）
            node scripts/windsor-mcp-call.mjs --tool "$ACTION" --args "$PARAMS_JSON" --max "${MAXLEN:-8000}" 2>&1 | tee out/result.txt
          elif [ "$DRY_RUN" = "docs" ]; then
            echo "== fetch llms-full.txt and grep execute endpoint =="
            curl -sS "https://mcp.windsor.ai/llms-full.txt" | grep -i -B3 -A12 "execute" | head -c 15000 || true
            echo "== try OPTIONS/other hints =="
            curl -sS -o /dev/null -w "POST /actions/execute -> %{http_code}\n" -X POST "https://connectors.windsor.ai/google_my_business/actions/execute?api_key=${WINDSOR_API_KEY}" -H "Content-Type: application/json" -d '{}' || true
          elif [ "$DRY_RUN" = "true" ]; then
            echo "== GET actions list for $CONNECTOR =="
            curl -sS "https://connectors.windsor.ai/${CONNECTOR}/actions?api_key=${WINDSOR_API_KEY}" | head -c 20000
          else
            echo "== POST $ACTION on $CONNECTOR =="
            curl -sS -X POST "https://connectors.windsor.ai/${CONNECTOR}/actions/${ACTION}?api_key=${WINDSOR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PARAMS_JSON" | head -c 20000
          fi
      - name: 結果を windsor-log ブランチへ残す
        if: always()
        run: |
          set -eu
          mkdir -p out
          [ -f out/result.txt ] || echo "(結果ファイルなし)" > out/result.txt
          {
            echo "connector: ${{ github.event.inputs.connector }}"
            echo "action:    ${{ github.event.inputs.action }}"
            echo "dry_run:   ${{ github.event.inputs.dry_run }}"
            echo "run:       ${{ github.run_id }}"
            echo "---"
          } > out/meta.txt
          cd out
          printf '{\n  "git": {\n    "deploymentEnabled": {\n      "windsor-log": false\n    }\n  }\n}\n' > vercel.json
          git init -b windsor-log -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "windsor: $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push --force -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windsor-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
