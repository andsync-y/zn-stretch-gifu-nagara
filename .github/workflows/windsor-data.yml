name: 広告データ取得（Windsor中継）

# Windsor MCPコネクタの接続断対策：毎朝、REST APIから数字を取得して
# windsor-dataブランチにコミットする。9時のデイリー監視Routineはgit経由で読む。
# あわせてMicrosoft Clarityの行動データ（clarity_7d.json）も同じブランチへ置く。
on:
  schedule:
    - cron: '0 23 * * *' # JST 8:00（監視Routineの1時間前）
  workflow_dispatch:

permissions:
  contents: write
  # GA4 / Search Console の認証に使う。Workload Identity 連携で
  # GitHubのOIDCトークンをGoogleのトークンへ交換するため、これが無いと取得できない。
  # （andsync.jp の組織ポリシーでサービスアカウントキーの発行が禁止されており、鍵方式が使えない）
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # マージ・剪定ロジックを実データに当てる前に単体テストを通す
      # （このブランチは毎回作り直すため、マージを間違えると過去分が静かに消える）
      - name: scripts/ のテスト
        run: node --test "scripts/test/*.test.mjs"

      # windsor-dataブランチは下のステップが毎回 git init + force push で作り直す。
      # Clarityは日次スナップショットを積み上げる方式なので、
      # 前回分をここで取り出しておかないと毎日1日分に戻ってしまう。
      - name: 前回のclarity_7d.jsonを取り出す
        run: |
          mkdir -p prev
          if git fetch --depth=1 origin windsor-data 2>/dev/null; then
            # 一度テンポラリへ書いてから移す。リダイレクトを直接当てると、
            # ファイルが無いときに0バイトのprevが残り「取得できた」と誤認する。
            if git show FETCH_HEAD:clarity_7d.json > /tmp/clarity_prev.json 2>/dev/null; then
              mv /tmp/clarity_prev.json prev/clarity_7d.json
              echo "前回分を取得しました（$(wc -c < prev/clarity_7d.json) bytes）"
            else
              rm -f /tmp/clarity_prev.json
              echo "windsor-dataブランチに clarity_7d.json はありません（初回）"
            fi
          else
            echo "windsor-dataブランチがありません（初回）"
          fi

      - run: node scripts/fetch-windsor-data.mjs

      # GA4とSearch Consoleは公式APIから直接取る（2026-08-27に移行）。
      # Windsorの料金はデータソース数で決まるため、この2つを外して接続を5→3にしBasicへ落とした。
      # 移行時にWindsor版と1行ずつ突き合わせ、1,743行すべて一致を確認済み。
      - name: GA4の実績を取得（公式API）
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetch-ga4-data.mjs
      - name: Search Consoleの実績を取得（公式API）
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetch-gsc-data.mjs

      # Clarityの行動データ。取得できなくても異常終了しない設計
      # （広告データの取得結果まで巻き添えでコミットされなくなるため）。
      - name: Clarityの行動データを取得
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node scripts/fetch-clarity-data.mjs
      - name: windsor-dataブランチへ強制コミット（履歴は持たない・Vercelビルドはスキップ）
        run: |
          cd out
          # このブランチはデータ置き場でありサイトのソースを含まない。
          # Vercelがプレビュービルドを試みて必ず失敗するため、明示的に無効化する。
          printf '{\n  "git": {\n    "deploymentEnabled": {\n      "windsor-data": false\n    }\n  }\n}\n' > vercel.json
          git init -b windsor-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windsor-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
