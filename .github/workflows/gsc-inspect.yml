# Search Console のURL検査を全ページに実行し、レポートを windsor-log ブランチへ置く。
# 「インデックス登録をリクエスト」に公式APIは無いため、検査とsitemap再送信までを自動化する。
name: gsc-inspect
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Workload Identity 連携（google-auth.mjs）

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: URL検査とsitemap再送信
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: node scripts/gsc-inspect.mjs
      - name: レポートを windsor-log ブランチへ
        if: always()
        run: |
          set -eu
          mkdir -p out
          [ -f out/gsc-inspect-report.md ] || echo "(レポートなし)" > out/gsc-inspect-report.md
          cp out/gsc-inspect-report.md out/result.txt
          cd out
          printf '{\n  "git": {\n    "deploymentEnabled": {\n      "windsor-log": false\n    }\n  }\n}\n' > vercel.json
          git init -b windsor-log -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "gsc-inspect: $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push --force -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windsor-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
