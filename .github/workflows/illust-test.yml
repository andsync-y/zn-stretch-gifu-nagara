name: 挿絵の設定比較テスト（手動・一時利用）

# キャラ挿絵の品質設定（quality / input_fidelity / モデル）を比較検証する使い捨てワークフロー。
# 結果は illust-test ブランチ（デプロイ無効）へコミットする。結論が出たら削除してよい。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 利用可能な画像モデルを一覧
        run: |
          mkdir -p out
          curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0));console.log(d.data.map(m=>m.id).filter(id=>/image|dall/.test(id)).sort().join('\n'))" \
            | tee out/image-models.txt
      - name: テスト用スペック（公開記事と同じ4ポーズ）
        run: |
          cat > test-spec.json << 'EOF'
          [
            { "file": "01-banzai", "pose": "sitting upright on a chair, raising both arms straight overhead with fingers interlaced, stretching the whole body upward (banzai stretch)" },
            { "file": "02-shoulder-blade", "pose": "sitting on a chair, hands on hips, squeezing both shoulder blades together toward the spine, chest slightly open" },
            { "file": "03-neck-side", "pose": "sitting on a chair, right hand gently placed on the left side of the head, tilting the head to the right to stretch the left side of the neck" },
            { "file": "04-chest-open", "pose": "sitting on a chair, both hands clasped behind the back, arms extended, opening the chest and stretching the shoulders" }
          ]
          EOF
      - name: 高品質＋高忠実度で生成
        run: node scripts/gen-stretch-illustrations.mjs --slug test --spec test-spec.json --quality high --outdir out/high
      - name: 中品質＋高忠実度で生成（コスト比較用）
        run: node scripts/gen-stretch-illustrations.mjs --slug test --spec test-spec.json --quality medium --outdir out/medium
      - name: illust-testブランチへコミット（デプロイ無効）
        run: |
          cd out
          printf '{\n  "git": {\n    "deploymentEnabled": {\n      "illust-test": false\n    }\n  }\n}\n' > vercel.json
          git init -b illust-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "test: 挿絵設定の比較 $(date -u +%Y-%m-%dT%H:%M)Z [skip ci]"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" illust-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
