# ポーズシート続編（17〜32）をAPIで1枚生成できるかの一発テスト。
# 結果は pose-sheet-test ブランチ（デプロイ無効）に置く。判定後このワークフローは削除する。
name: pose-sheet-test
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: シート2候補を生成（2枚）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p out
          node scripts/gen-pose-sheet.mjs --spec scripts/sheet2-spec.json --out out/sheet2-cand.png --n 2
      - name: 結果をpose-sheet-testブランチへ
        run: |
          mkdir pub && cp out/*.png pub/
          printf '%s' '{"git":{"deploymentEnabled":{"pose-sheet-test":false}}}' > pub/vercel.json
          cd pub
          git init -b pose-sheet-test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "pose sheet 2 candidates [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" pose-sheet-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
