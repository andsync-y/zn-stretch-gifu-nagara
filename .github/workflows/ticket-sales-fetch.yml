name: 来店記録CSVの構造確認（手動・調査用）

# 店舗システムの「来店記録」からCSVをダウンロードし、中身の“形”だけを報告する。
# 月次のCAPI送信（capi-upload.yml）が「列がない」等で落ちたときに、
# 画面のどこが変わったのかを推測せず確かめるための調査用。
#
# ⚠️ CSVには顧客名が含まれるが、ダウンロード先はこの実行環境（毎回破棄）のみ。
#    リポジトリにもDriveにも保存せず、実行サマリーにも顧客名・顧客IDの値は出さない。
#    どのブランチにも書き込まないので、週次KPIジョブには影響しない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存関係とブラウザの準備
        run: |
          cd kpi-scraper
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 来店記録CSVの解析テスト
        run: node --test kpi-scraper/test/visit-csv.test.mjs
      - name: CSV取得と形の確認
        env:
          ZN_SYSTEM_USER: ${{ secrets.ZN_SYSTEM_USER }}
          ZN_SYSTEM_PASS: ${{ secrets.ZN_SYSTEM_PASS }}
          MODE: inspect
        run: |
          cd kpi-scraper
          node fetch-ticket-sales.mjs
