name: 来店記録CSVの取得確認（手動・調査用）

# 店舗システムの「来店記録」からCSVをダウンロードし、中身の“形”だけを報告する。
# 回数券成約パイプラインを組む前に、列名・文字コード・日付範囲・回数券列の値を実物で確認するため。
#
# ⚠️ CSVには氏名が含まれるが、ダウンロード先はこの実行環境（毎回破棄）のみ。
#    リポジトリにもDriveにも保存せず、実行サマリーにも氏名・顧客IDの値は出さない。
#    どのブランチにも書き込まないので、週次KPIジョブには影響しない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 依存関係とブラウザの準備
        run: |
          cd kpi-scraper
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: CSV取得と形の確認
        env:
          ZN_SYSTEM_USER: ${{ secrets.ZN_SYSTEM_USER }}
          ZN_SYSTEM_PASS: ${{ secrets.ZN_SYSTEM_PASS }}
        run: |
          cd kpi-scraper
          node fetch-ticket-sales.mjs
