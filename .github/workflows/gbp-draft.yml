name: GBP投稿ドラフト生成（週次）

# 直近のコラムから、Googleビジネスプロフィール「最新情報」投稿のドラフトを作る。
# 生成はLLMを使わない決定的な処理なので、APIキーもクレジット残高も不要（0円・数秒）。
# 結果はActionsの実行サマリーに出るので、オーナーはそこからコピペするだけでよい（1件3分）。
# GBP APIの利用申請が通ったら、--json の出力をそのまま create_local_post に流して自動投稿にできる。
on:
  schedule:
    - cron: '0 23 * * 0' # JST 月曜8:00（週次経営レビューの前）
  workflow_dispatch:
    inputs:
      days:
        description: '何日以内に公開されたコラムを対象にするか（既定7）'
        required: false
        default: '7'
      latest:
        description: '期間を無視して新しい順にN本（指定時はdaysより優先）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ドラフト生成
        run: |
          if [ -n "${{ inputs.latest }}" ]; then
            node scripts/gbp-post-draft.mjs --latest "${{ inputs.latest }}"
          else
            node scripts/gbp-post-draft.mjs --days "${{ inputs.days || '7' }}"
          fi
