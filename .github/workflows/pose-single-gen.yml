# 単発ポーズイラスト生成（参照カードのポーズが不正確なときの修正用）。
# 結果は pose-sheet-test ブランチ（デプロイ無効）へ。
name: pose-single-gen
on:
  workflow_dispatch:
    inputs:
      pose:
        description: '英語のポーズ詳細指定'
        required: true
      count:
        description: '候補枚数'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 生成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSE_DESC: ${{ github.event.inputs.pose }}
        run: |
          mkdir -p out
          node scripts/gen-single-pose.mjs --pose "$POSE_DESC" --out out/single.png --n "${{ github.event.inputs.count || '3' }}"
      - name: 結果をpose-sheet-testブランチへ
        run: |
          mkdir pub && cp out/*.png pub/
          printf '%s' '{"git":{"deploymentEnabled":{"pose-sheet-test":false}}}' > pub/vercel.json
          cd pub
          git init -b pose-sheet-test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "single pose candidates [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" pose-sheet-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
